name: PT Data export regression tests
on:
  push:
    branches: [phase1/market-data-foundation]
    paths:
      - 'Monitor/_Internal/PTDataExportService.cs'
      - 'Tests/PTDataExport/**'
      - '.github/workflows/ptdata-export.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  export-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Inspect pinned official PT 2.6.1 history API contract (no bot execution)
        shell: bash
        run: |
          curl --fail --location --retry 2 --max-time 120 https://github.com/taniman/profit-trailer/releases/download/2.6.1/ProfitTrailer-2.6.1.zip -o "$RUNNER_TEMP/pt-contract.zip"
          echo "ab2b63e5da061b9e7029cfb4060b5ffd7da9d4615f891bbdf9f0f3275b47a6a3  $RUNNER_TEMP/pt-contract.zip" | sha256sum --check
          python3 - <<'PY'
          import io, os, pathlib, re, subprocess, zipfile
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'pt-contract'
          root.mkdir(exist_ok=True)
          with zipfile.ZipFile(root.parent / 'pt-contract.zip') as release:
              jarname = next(n for n in release.namelist() if n.endswith('/ProfitTrailer.jar') or n == 'ProfitTrailer.jar')
              jarbytes = release.read(jarname)
          with zipfile.ZipFile(io.BytesIO(jarbytes)) as jar:
              candidates = []
              for name in jar.namelist():
                  if not name.endswith('.class'): continue
                  data = jar.read(name)
                  if b'/api/v2/data' in data or (b'perPage' in data and b'sortDirection' in data and (b'buys' in data or b'sales' in data)):
                      candidates.append(name)
                      target = root / pathlib.Path(name).name
                      target.write_bytes(data)
                      result = subprocess.run(['javap', '-p', '-c', '-v', str(target)], text=True, capture_output=True, check=True).stdout
                      methods = re.split(r'(?=^  (?:public|private|protected) )', result, flags=re.M)
                      print('CONTRACT CLASS:', name)
                      for method in methods[1:]:
                          if re.search(r'(?i)\b(buys|sales|getBuys|getSales|buyHistory|sellHistory|saleHistory)\b', method):
                              print(method[:40000])
              print('CONTRACT CANDIDATES:', candidates)
          PY
      - name: Compile and exercise the actual HTTP to JSON to ZIP implementation
        run: dotnet run --project Tests/PTDataExport/PTDataExport.csproj --configuration Release
      - name: Build Monitor with the replacement exporter
        run: dotnet build Monitor/Monitor.csproj --configuration Release
