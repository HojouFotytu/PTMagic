name: PTMagic 2.10 - build and regression tests

on:
  push:
    branches:
      - phase1/market-data-foundation
    paths:
      - 'Core/**'
      - 'Monitor/**'
      - 'PTMagic/**'
      - 'Tests/**'
      - '.github/workflows/phase1-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-regress:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out the tested branch
        uses: actions/checkout@v4
      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Prepare non-secret build settings
        run: |
          cp PTMagic/_defaults/_default_settings_PT_2.x/settings.general.json PTMagic/settings.general.json
          cp PTMagic/_defaults/_default_settings_PT_2.x/settings.analyzer.json PTMagic/settings.analyzer.json
      - name: Build application
        run: dotnet build PTMagic.sln --configuration Release
      - name: Phase1AReadiness
        run: dotnet run --project Tests/Phase1AReadiness/Phase1AReadiness.csproj --configuration Release
      - name: Phase1COhlcv
        run: dotnet run --project Tests/Phase1COhlcv/Phase1COhlcv.csproj --configuration Release
      - name: Phase1MetricWarnings
        run: dotnet run --project Tests/Phase1MetricWarnings/Phase1MetricWarnings.csproj --configuration Release
      - name: Phase1SmsSummaryIsolation
        run: dotnet run --project Tests/Phase1SmsSummaryIsolation/Phase1SmsSummaryIsolation.csproj --configuration Release
      - name: Phase1TriggerLogic
        run: dotnet run --project Tests/Phase1TriggerLogic/Phase1TriggerLogic.csproj --configuration Release
      - name: NormalizedPriceTrendMigration
        run: dotnet run --project Tests/NormalizedPriceTrendMigration/NormalizedPriceTrendMigration.csproj --configuration Release
